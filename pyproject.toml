[project]
name = "blindspot"
version = "0.1.0"
description = "Endpoint browser-extension inventory, risk scoring and policy generation"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
